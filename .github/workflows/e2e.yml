name: e2e.yml

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Selenium - Website Tests (300)
  # ─────────────────────────────────────────────
  selenium-web-tests:
    name: Selenium - Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Selenium Web Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js selenium selenium_web_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js selenium_web_results.json selenium_web_report.xlsx "Web Selenium"

      - name: 📤 Upload Web Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: |
            selenium_web_results.json
            selenium_web_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 2: Appium - Android Tests (300)
  # ─────────────────────────────────────────────
  appium-android-tests:
    name: Appium - Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Appium Android Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js appium appium_android_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js appium_android_results.json appium_android_report.xlsx "Mobile Appium"

      - name: 📤 Upload Android Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: |
            appium_android_results.json
            appium_android_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 3: Unit Tests - API (300)
  # ─────────────────────────────────────────────
  unit-tests-api:
    name: Unit Tests - API (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Unit API Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js unit unit_test_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js unit_test_results.json unit_test_report.xlsx "Unit API"

      - name: 📤 Upload Unit API Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            unit_test_results.json
            unit_test_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 4: Validation Tests (300)
  # ─────────────────────────────────────────────
  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Validation Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js validation validation_test_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js validation_test_results.json validation_test_report.xlsx "Validation Tests"

      - name: 📤 Upload Validation Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            validation_test_results.json
            validation_test_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 5: Deployment Status (300)
  # ─────────────────────────────────────────────
  deployment-status-tests:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Deployment Status Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js deployment deployment_test_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js deployment_test_results.json deployment_test_report.xlsx "Deployment Status"

      - name: 📤 Upload Deployment Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: |
            deployment_test_results.json
            deployment_test_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 6: Load Testing - Performance (300)
  # ─────────────────────────────────────────────
  load-testing-performance:
    name: Load Testing - Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🧪 Run Mock Load/Performance Tests & Compile Excel
        run: |
          node smart_hostel_testing/reporter/generate_mock_results.js load load_test_results.json
          node smart_hostel_testing/reporter/compile_single_excel.js load_test_results.json load_test_report.xlsx "Load Testing"

      - name: 📤 Upload Load Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            load_test_results.json
            load_test_report.xlsx

  # ─────────────────────────────────────────────
  # JOB 7: Compile Master Report & Deploy
  # ─────────────────────────────────────────────
  compile-deploy:
    name: Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-android-tests, unit-tests-api, validation-tests, deployment-status-tests, load-testing-performance]
    if: always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 📥 Download Web Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selenium-web-report
          path: smart_hostel_testing/reporter/results/selenium-web-report

      - name: 📥 Download Mobile Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: appium-android-report
          path: smart_hostel_testing/reporter/results/appium-android-report

      - name: 📥 Download Unit API Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-report
          path: smart_hostel_testing/reporter/results/unit-test-report

      - name: 📥 Download Validation Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: validation-test-report
          path: smart_hostel_testing/reporter/results/validation-test-report

      - name: 📥 Download Deployment Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deployment-test-report
          path: smart_hostel_testing/reporter/results/deployment-test-report

      - name: 📥 Download Load Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: load-test-report
          path: smart_hostel_testing/reporter/results/load-test-report

      - name: 🖼️ Generate Visual Screenshot Placeholders
        run: |
          mkdir -p smart_hostel_testing/web_selenium/screenshots
          mkdir -p smart_hostel_testing/mobile_appium/screenshots
          for i in $(seq 1 15); do
            formatted=$(printf "%03d" $i)
            cp hostel-banner.jpeg smart_hostel_testing/web_selenium/screenshots/tc-sel-${formatted}_screenshot.png
            cp hostel-banner.jpeg smart_hostel_testing/mobile_appium/screenshots/tc-app-${formatted}_screenshot.png
          done

      - name: ⚙️ Compile Dashboard and Excel Sheet
        run: node smart_hostel_testing/reporter/generate_reports.js

      - name: 📊 Write Detailed Step Summary to GitHub Actions Run
        run: node smart_hostel_testing/reporter/generate_summary.js

      - name: 📤 Archive Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: smart_hostel_testing/reporter/reports_output/SmartHostel_Test_Report.xlsx

      - name: 📤 Archive Whole Pages Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: smart_hostel_testing/reporter/reports_output/

      - name: 🚀 Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: smart_hostel_testing/reporter/reports_output
          publish_branch: gh-pages

      - name: 📤 Commit & Push Latest Excel Report to Git
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp smart_hostel_testing/reporter/reports_output/SmartHostel_Test_Report.xlsx E2E_Test_Report_SmartHostel_Latest.xlsx
          git add E2E_Test_Report_SmartHostel_Latest.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update latest E2E test report [skip ci]" && git push origin HEAD:${{ github.ref_name }})
