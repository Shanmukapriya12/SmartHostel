name: selenium-login.yml

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Selenium E2E Web + API Tests
  # ─────────────────────────────────────────────
  selenium-web-tests:
    name: Selenium E2E Web + API Tests
    runs-on: ubuntu-latest
    continue-on-error: true   # Don't block downstream jobs if tests fail

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: smart_hostel
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo, pdo_mysql

      - name: 🔍 Check PHP Syntax Lint
        run: |
          ERROR=0
          for file in $(find . -name "*.php" -not -path "./.git/*" -not -path "./node_modules/*"); do
            php -l "$file"
            if [ $? -ne 0 ]; then
              echo "❌ Syntax error in $file"
              ERROR=1
            fi
          done
          if [ $ERROR -eq 1 ]; then
            exit 1
          fi

      - name: 🗄️ Load Database Schema
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS smart_hostel;"
          mysql -h 127.0.0.1 -u root smart_hostel < database_utf8.sql
          echo "✅ Database schema seeded successfully."

      - name: 🟢 Start Local PHP Server
        run: |
          php -S localhost:8000 &
          sleep 2
          echo "✅ PHP Server started on port 8000"

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🔧 Make ChromeDriver Executable
        run: |
          CHROMEDRIVER_BIN="node_modules/chromedriver/lib/chromedriver/chromedriver"
          if [ -f "$CHROMEDRIVER_BIN" ]; then
            chmod +x "$CHROMEDRIVER_BIN"
            echo "✅ ChromeDriver marked executable: $CHROMEDRIVER_BIN"
            "$CHROMEDRIVER_BIN" --version || true
          else
            echo "ℹ️  npm chromedriver binary not found at expected path."
            which chromedriver 2>/dev/null && echo "Using system chromedriver: $(chromedriver --version)" || echo "No system chromedriver found either — Selenium Manager will handle it."
          fi

      - name: 🧪 Run Selenium Web Tests (Headless)
        continue-on-error: true   # Test failures are recorded, not workflow failures
        env:
          BASE_URL: http://localhost:8000
          CI: true
        run: node smart_hostel_testing/web_selenium/run_web_tests.js --headless

      - name: 📤 Upload Web Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: |
            smart_hostel_testing/web_selenium/web_results.json
            smart_hostel_testing/web_selenium/screenshots/

  # ─────────────────────────────────────────────
  # JOB 2: Appium Mobile Tests Dry-Run
  # ─────────────────────────────────────────────
  appium-mobile-tests:
    name: Appium Mobile Tests Dry-Run
    runs-on: ubuntu-latest
    continue-on-error: true   # Don't block downstream jobs if tests fail

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart_hostel_testing/mobile_appium/requirements.txt

      - name: 🧪 Run Pytest Mobile Suite (Dry-Run Mode)
        continue-on-error: true   # Test failures are recorded, not workflow failures
        env:
          APPIUM_DRY_RUN: 'true'
        run: python smart_hostel_testing/mobile_appium/run_mobile_tests.py

      - name: 📤 Upload Mobile Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: |
            smart_hostel_testing/mobile_appium/mobile_results.json
            smart_hostel_testing/mobile_appium/screenshots/

  # ─────────────────────────────────────────────
  # JOB 3: Generate Unified Excel & Markdown Summary
  # ─────────────────────────────────────────────
  generate-reports:
    name: Generate LifeLink_Test_Report
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-mobile-tests]
    if: always()   # Always run — even if test jobs failed or were cancelled

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 📥 Download Web Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-test-results
          path: smart_hostel_testing/web_selenium

      - name: 📥 Download Mobile Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-test-results
          path: smart_hostel_testing/mobile_appium

      - name: 📂 Create Fallback Empty Results (if downloads failed)
        run: |
          WEB_JSON="smart_hostel_testing/web_selenium/web_results.json"
          MOB_JSON="smart_hostel_testing/mobile_appium/mobile_results.json"
          if [ ! -f "$WEB_JSON" ]; then
            echo "[]" > "$WEB_JSON"
            echo "⚠️  Created empty web_results.json (web test job may have failed)"
          fi
          if [ ! -f "$MOB_JSON" ]; then
            echo "[]" > "$MOB_JSON"
            echo "⚠️  Created empty mobile_results.json (mobile test job may have failed)"
          fi
          echo "Web results: $(cat $WEB_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d), \"records\")')"
          echo "Mobile results: $(cat $MOB_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d), \"records\")')"

      - name: ⚙️ Compile Dashboard and Excel Sheet
        run: node smart_hostel_testing/reporter/generate_reports.js

      - name: 📊 Write Detailed Step Summary to GitHub Actions Run
        run: node smart_hostel_testing/reporter/generate_summary.js

      - name: 📤 Archive Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHostel_Test_Report
          path: smart_hostel_testing/reporter/reports_output/SmartHostel_Test_Report.xlsx

  # ─────────────────────────────────────────────
  # JOB 4: Deploy HTML Report to GitHub Pages
  # ─────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-mobile-tests]
    continue-on-error: true   # Won't fail overall workflow if Pages isn't configured yet
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    environment:
      name: github-pages
      url: https://Shanmukapriya12.github.io/SmartHostel
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 📥 Download Web Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-test-results
          path: smart_hostel_testing/web_selenium

      - name: 📥 Download Mobile Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-test-results
          path: smart_hostel_testing/mobile_appium

      - name: 📂 Create Fallback Empty Results (if downloads failed)
        run: |
          WEB_JSON="smart_hostel_testing/web_selenium/web_results.json"
          MOB_JSON="smart_hostel_testing/mobile_appium/mobile_results.json"
          if [ ! -f "$WEB_JSON" ]; then
            echo "[]" > "$WEB_JSON"
            echo "⚠️  Created empty web_results.json"
          fi
          if [ ! -f "$MOB_JSON" ]; then
            echo "[]" > "$MOB_JSON"
            echo "⚠️  Created empty mobile_results.json"
          fi

      - name: ⚙️ Compile Dashboard and Excel Sheet
        run: node smart_hostel_testing/reporter/generate_reports.js

      - name: 🚀 Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: smart_hostel_testing/reporter/reports_output
          publish_branch: gh-pages
